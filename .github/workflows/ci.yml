name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.6
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests + model quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # The tests serve the locally trained artifact, so the model has to exist before
      # they run. Training on every CI run is affordable precisely because the model is
      # small -- and it means CI validates the training code too, not just the server.
      # data/queries.csv is DVC-tracked, not committed, so a fresh checkout here
      # regenerates it from the same public sources rather than needing DVC remote
      # credentials wired into CI.
      - name: Prepare data and train router
        run: |
          python -m router.prepare_data
          python -m router.train --no-mlflow
          python -m router.drift

      - name: Run tests
        run: pytest

      # This is the step that makes it an *ML* pipeline rather than a web app with
      # tests attached: a change that keeps every test green but makes the model worse
      # or more expensive stops here instead of reaching production.
      - name: Model quality gate
        run: python -m scripts.quality_gate

      - name: Upload model metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-metrics
          path: models/metrics.json
          if-no-files-found: warn

  docker:
    name: Docker build, test & publish
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build gateway image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          push: false
          load: true
          tags: smartroute-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Proves the image actually serves, not just that it builds.
      - name: Smoke-test the image
        run: |
          docker run -d --name gw -p 8000:8000 \
            -e MODEL_SOURCE=local -e FORCE_MOCK=true smartroute-gateway:ci
          for i in $(seq 1 30); do
            if curl -sf localhost:8000/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -sf -X POST localhost:8000/v1/chat \
            -H 'content-type: application/json' \
            -H 'X-API-Key: demo-key-smartroute' \
            -d '{"query":"Who wrote Pride and Prejudice?"}' \
            | tee /dev/stderr | grep -q 'gpt-oss-20b'
          docker rm -f gw

      # Publish to GitHub Container Registry (GHCR) when pushed to main
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image names
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: image_names
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "gateway=ghcr.io/${OWNER}/smartroute-gateway" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${OWNER}/smartroute-frontend" >> "$GITHUB_OUTPUT"

      - name: Publish gateway to GHCR
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          tags: |
            ${{ steps.image_names.outputs.gateway }}:latest
            ${{ steps.image_names.outputs.gateway }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish frontend to GHCR
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.image_names.outputs.frontend }}:latest
            ${{ steps.image_names.outputs.frontend }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
